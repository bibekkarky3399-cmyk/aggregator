name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and forbidden-file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the last commit

      - name: Block database, env, key and PDF files
        run: |
          bad=$(git ls-files | grep -E '(\.db|\.sqlite3?|\.db-journal|\.pem|\.key|\.p12|\.pfx|\.pdf)$|(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden files are tracked in git:"; echo "$bad"; exit 1
          fi

      - name: Gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  tests:
    name: Tests (run twice, fresh database each time)
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: First run
        run: python -m pytest -q -p no:cacheprovider
      - name: Second run (catches tests that only pass once)
        run: python -m pytest -q -p no:cacheprovider
