# Install once per machine:  pip install pre-commit && pre-commit install
# After that, every `git commit` is scanned and blocked if it contains a secret,
# a database file, an .env file, or a large binary.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: forbid-new-submodules

  - repo: local
    hooks:
      - id: forbid-secret-files
        name: Block database, env and supplier files
        entry: "Refusing to commit a database, .env, key or PDF file. These must never be in git."
        language: fail
        files: '(\.db|\.sqlite3?|\.db-journal|\.pem|\.key|\.p12|\.pfx|\.pdf|(^|/)\.env(\..+)?)$'
        exclude: '(^|/)\.env\.example$'
